name: Quality

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    container: node:26.12.1-bookworm-slim@sha256:28147155d47dc31abe0a46e0d12b59b2fb3d0a2dcc5dc65fce76a074180b16fe
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: builtin:checkout
        with:
          fetch-depth: 1
      - name: Print Node and npm versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
