name: Quality

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    container: node:24-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: builtin:checkout
        with:
          fetch-depth: 1
      - name: Print Node and npm versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
